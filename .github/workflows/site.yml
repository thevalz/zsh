name: Build matchups + waiver site

# Regenerates the weekly matchup report and the waiver/trade report, renders
# them into docs/, and commits the result. GitHub Pages is set to
# "Deploy from a branch" -> this branch -> /docs, so the commit is the deploy.
#
# This workflow is the ONLY writer of fantasy/state/snapshot.json. The hourly
# Claude Routine reads it as the diff baseline and never pushes: Routine
# sessions carry no push credential for main, and every snapshot push they
# attempted between 2026-09-06 and 2026-09-14 failed. Running hourly keeps the
# baseline fresh for the Routine that follows it at :50.
#
# GitHub only runs `schedule` triggers from the repository's default branch,
# which is `main`, so the crons below are live.

on:
  push:
    branches:
      - main
    paths:
      - 'matchups.py'
      - 'build_site.py'
      - 'wr_alignment_overrides.json'
      - 'fantasy/**.py'
      - '.github/workflows/site.yml'
  schedule:
    # Hourly at :05 so the snapshot baseline is fresh for the Routine at :50
    # (GitHub delays scheduled runs by up to ~30 minutes under load), plus
    # Tuesday morning (waivers, after MNF) and Sunday morning (final lineups)
    # at 12:00 UTC.
    - cron: '5 * * * *'
    - cron: '0 12 * * 2,0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The value model reads ~80 MB of outside data (two prior seasons of
      # weekly stat lines for the usage fit, ESPN/FantasyPros/Sleeper
      # projections, nflverse schedules and snap counts). Each fetch has its
      # own TTL in fantasy/config.py; without a persisted cache every hourly
      # run would refetch all of it and scrape FantasyPros 24 times a day
      # instead of the 4 the TTL intends. run_id keys mean every run saves a
      # fresh cache and the next one restores the newest.
      - uses: actions/cache@v4
        with:
          path: |
            fantasy/.cache
            .cache
          key: model-cache-${{ github.run_id }}
          restore-keys: |
            model-cache-

      - name: Weekly matchup report
        id: matchups
        run: python3 matchups.py --full --markdown --out-dir matchups
        continue-on-error: true

      - name: Waiver and trade report
        id: waivers
        run: python3 -m fantasy.monitor report --out reports/waivers.md
        continue-on-error: true

      - name: Rest-of-season values for every roster
        id: values
        run: python3 -m fantasy.monitor values --out reports/values.md
        continue-on-error: true

      # Tuesday, after Monday night: score the value model on every completed
      # week so reports/backtest.md accumulates a week at a time. Any change to
      # a model constant has to cite these numbers (CLAUDE.md).
      - name: Backtest the value model on completed weeks
        id: backtest
        if: github.event.schedule == '0 12 * * 2' || github.event_name == 'workflow_dispatch'
        run: python3 -m fantasy.backtest
        continue-on-error: true

      - name: Report step failures without killing the build
        if: steps.matchups.outcome == 'failure' || steps.waivers.outcome == 'failure' || steps.values.outcome == 'failure' || steps.backtest.outcome == 'failure'
        run: |
          echo "::warning::matchups=${{ steps.matchups.outcome }} waivers=${{ steps.waivers.outcome }} values=${{ steps.values.outcome }} backtest=${{ steps.backtest.outcome }}; site rebuilt from whatever reports exist"

      - name: Render docs/
        run: python3 build_site.py

      - name: Commit the rebuilt site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs matchups reports fantasy/state
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Rebuild site ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
