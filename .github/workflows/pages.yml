name: Build and deploy draft console

on:
  push:
    branches:
      - claude/fantasy-keeper-recommendations-tp9ron
    paths:
      - 'app/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  # Rebuilds pull fresh ADP, so a daily run keeps the numbers current on their
  # own — the console is most wrong when its values are a month old.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let a scheduled run and a push deploy over each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build console with fresh ADP
        id: build
        run: python3 app/build.py
        continue-on-error: true

      - name: Fall back to cached data if the ADP feed is down
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::ADP fetch failed; building from the copy in data/"
          python3 app/build.py --no-fetch

      - name: Check the bundle actually parses
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("app/dist/draft-live.html", "utf8");
            const m = h.match(/<script>\n([\s\S]*?)\n<\/script>/);
            if (!m) { console.error("no script block in the built file"); process.exit(1); }
            new Function(m[1]);
            if (!/id="DATA"/.test(h)) { console.error("data payload missing"); process.exit(1); }
            console.log("bundle OK,", Math.round(h.length / 1024) + " KB");
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
