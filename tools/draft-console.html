<title>Zebras Draft Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f5;--surface:#fff;--surface-2:#e9eeed;--line:#dbe2e0;
  --text:#111819;--muted:#5b686b;--faint:#8b989b;
  --accent:#0d6b5a;--hot:#a8720a;--hot-bg:#fdf1d8;
  --pos:#127a5c;--neg:#c03b52;--mine:#0d6b5a;--mine-bg:#dff0ea;
  --qb:#c9445c;--rb:#17936a;--wr:#3a7fd0;--te:#c4762a;--pk:#7b6ad0;--def:#5c7078;
  --shadow:0 1px 2px rgba(17,24,25,.05),0 4px 16px rgba(17,24,25,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1214;--surface:#151d20;--surface-2:#1c262a;--line:#28343a;
  --text:#e5ecea;--muted:#8fa0a4;--faint:#6b7c81;
  --accent:#3cbb9c;--hot:#f0b429;--hot-bg:#3a2d0e;
  --pos:#3ed19c;--neg:#f0798c;--mine:#3cbb9c;--mine-bg:#123029;
  --qb:#e8697f;--rb:#2fc48d;--wr:#5f9fe8;--te:#e8963f;--pk:#a08ce8;--def:#8fa3ab;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0d1214;--surface:#151d20;--surface-2:#1c262a;--line:#28343a;
  --text:#e5ecea;--muted:#8fa0a4;--faint:#6b7c81;
  --accent:#3cbb9c;--hot:#f0b429;--hot-bg:#3a2d0e;
  --pos:#3ed19c;--neg:#f0798c;--mine:#3cbb9c;--mine-bg:#123029;
  --qb:#e8697f;--rb:#2fc48d;--wr:#5f9fe8;--te:#e8963f;--pk:#a08ce8;--def:#8fa3ab;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 64px;display:flex;flex-direction:column;gap:16px}

/* status bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;
  align-items:center;gap:10px 20px}
.bar.clock{border-color:var(--hot);background:var(--hot-bg)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.clockmsg{font-weight:700;font-size:16px;color:var(--hot);letter-spacing:-.01em}
.spacer{flex:1 1 auto}
button{font-family:inherit;font-size:12px;font-weight:500;padding:6px 11px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.warn:hover{border-color:var(--neg);color:var(--neg)}
button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* layout */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.card h2{margin:0;padding:11px 16px;font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:16px}

/* recs */
.rec{display:flex;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.rec:last-child{border-bottom:none}
.rec.top{background:var(--hot-bg)}
.rank{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--faint);width:14px;flex:none;padding-top:3px}
.rec-main{flex:1;min-width:0}
.rec-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.rec-why{font-size:12.5px;color:var(--muted);margin-top:3px}
.rec-why b{color:var(--text);font-weight:600}
.take{flex:none;align-self:center}

/* table */
.tools{display:flex;flex-wrap:wrap;gap:7px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
input[type=search]{flex:1;min-width:150px;font-family:inherit;font-size:13px;padding:7px 10px;
  border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.board{max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;
  padding:7px 9px;border-bottom:1px solid var(--line);z-index:2}
th:first-child{text-align:left;padding-left:14px}
td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
td:first-child{text-align:left;padding-left:14px;font-family:Archivo,sans-serif;color:var(--text);font-weight:500}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.gone td{opacity:.34;text-decoration:line-through}
tr.mineRow td{background:var(--mine-bg)}
tr.mineRow td:first-child{box-shadow:inset 3px 0 0 var(--mine)}
.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  padding:2px 4px;border-radius:2px;color:#fff;margin-right:7px;min-width:27px;text-align:center}
.b-QB{background:var(--qb)}.b-RB{background:var(--rb)}.b-WR{background:var(--wr)}
.b-TE{background:var(--te)}.b-PK{background:var(--pk)}.b-DEF{background:var(--def)}
.mini{font-size:10px;padding:2px 6px;border-radius:4px}
.edge-pos{color:var(--pos);font-weight:600}.edge-neg{color:var(--neg)}

/* roster + scarcity */
.slotrow{display:flex;align-items:center;gap:9px;padding:6px 16px;border-bottom:1px solid var(--line);font-size:13px}
.slotrow:last-child{border-bottom:none}
.slotlab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:var(--faint);width:74px;flex:none}
.empty{color:var(--faint);font-style:italic}
.scar{padding:9px 16px;border-bottom:1px solid var(--line)}
.scar:last-child{border-bottom:none}
.scar-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.scar-hd b{font-family:"IBM Plex Mono",monospace;font-size:12px}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.scar-note{font-size:11.5px;color:var(--faint);margin-top:4px}
.warnTxt{color:var(--neg);font-weight:600}
footer{font-size:11.5px;color:var(--faint);line-height:1.6;padding-top:6px}
kbd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;background:var(--surface-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="bar" id="bar">
    <div class="stat"><b id="sPick">1</b><span>pick now</span></div>
    <div class="stat"><b id="sNext">2</b><span>your next</span></div>
    <div class="stat"><b id="sGap">—</b><span>picks away</span></div>
    <div class="stat"><b id="sLeft">14</b><span>your picks left</span></div>
    <div id="clockMsg" class="clockmsg"></div>
    <div class="spacer"></div>
    <button id="bKeep">Pre-mark keepers</button>
    <button id="bMock">Mock mode</button>
    <button id="bUndo">Undo</button>
    <button id="bReset" class="warn">Reset</button>
  </div>

  <div class="grid">
    <div class="stack">
      <div class="card">
        <h2>Take one of these</h2>
        <div id="recs"></div>
      </div>
      <div class="card">
        <h2>Player board</h2>
        <div class="tools">
          <input type="search" id="q" placeholder="Search — Enter marks top hit gone, Shift+Enter drafts him for you" autocomplete="off">
          <span id="filters"></span>
          <button id="bHide" class="mini on">Hide drafted</button>
        </div>
        <div class="board"><table>
          <thead><tr><th>Player</th><th>Tm</th><th>Bye</th><th>ADP</th><th>vs pick</th><th></th></tr></thead>
          <tbody id="tb"></tbody>
        </table></div>
      </div>
    </div>

    <div class="stack">
      <div class="card"><h2>Positional runway</h2><div id="scar"></div></div>
      <div class="card"><h2>Your roster</h2><div id="roster"></div></div>
      <div class="card"><h2>Bench</h2><div id="bench"></div></div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

  const slots=D.slots.map(s=>({s,p:null})),pool=[...list].sort((a,b)=>a.a-b.a);
  const grab=t=>{const i=pool.findIndex(p=>t.includes(p.p));return i<0?null:pool.splice(i,1)[0]};
  for(const sl of slots) if(!['FLEX','SUPER_FLEX'].includes(sl.s)) sl.p=grab([sl.s]);
  for(const sl of slots) if(sl.s==='FLEX') sl.p=grab(FLEX);
  for(const sl of slots) if(sl.s==='SUPER_FLEX') sl.p=grab(SF);
  return {slots,bench:pool};
}
function needWeight(pos){
  const {slots}=fill(mine()),open=s=>slots.some(x=>x.s===s&&!x.p);
  const left=myPicks().filter(x=>x>=S.pick).length;
  if(pos==='PK'||pos==='DEF') return open(pos==='PK'?'K':'DEF')?(left<=3?1.3:0.02):0.01;
  if(open(pos)) return 1;
  if(FLEX.includes(pos)&&open('FLEX')) return .8;
  if(SF.includes(pos)&&open('SUPER_FLEX')) return pos==='QB'?.95:.7;
  const depth=mine().filter(p=>p.p===pos).length;
  return depth>=4?.12:.34;
}
/* ---- VONA ---- */
function vona(){
  const a=avail(),gap=horizon(),surv=a.slice(gap),out={};
  for(const pos of ['QB','RB','WR','TE','PK','DEF']){
    const now=a.find(p=>p.p===pos),nxt=surv.find(p=>p.p===pos);
    if(!now)continue;
    out[pos]={now,nxt,delta:nxt?nxt.a-now.a:120,gap};
  }
  return out;
}
function computeRecs(){
  const v=vona(),out=[];
  for(const pos in v){
    const {now,nxt,delta}=v[pos],w=needWeight(pos),edge=S.pick-now.a;
    out.push({p:now,pos,w,delta,edge,nxt,score:w*(0.6*delta+0.4*edge)});
  }
  // a kicker or defense is never a real recommendation until the very end
  const live=out.filter(r=>!(['PK','DEF'].includes(r.pos)&&r.w<0.5));
  (live.length?live:out).sort((x,y)=>y.score-x.score);
  return (live.length?live:out).slice(0,3);
}

/* ---- actions ---- */
function mark(name,who){
  if(S.drafted[name])return;
  S.drafted[name]=who;S.hist.push({n:name,w:who,pick:S.pick});S.pick++;save();render();
}
function undo(){const h=S.hist.pop();if(!h)return;delete S.drafted[h.n];S.pick=h.pick;save();render()}

/* ---- render ---- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const n=nextPick(),f=target(),clock=onClock();
  sPick.textContent=S.pick;sNext.textContent=n??'—';
  sGap.textContent=clock?'now':(n?n-S.pick:'—');
  sLeft.textContent=myPicks().filter(x=>x>=S.pick).length;
  bar.classList.toggle('clock',clock);
  clockMsg.textContent=clock?"YOU'RE ON THE CLOCK":'';
  bMock.classList.toggle('on',S.mock);bMock.textContent=S.mock?'Mock mode: ON':'Mock mode';
  bHide.classList.toggle('on',S.hide);

  // recommendations
  const R=computeRecs();
  document.getElementById('recs').innerHTML=R.map((r,i)=>{
    const wait=r.delta>=120?`<b>nobody left at ${r.pos}</b> after this run`
      :r.nxt&&r.nxt.n===r.p.n?`should survive to your next pick — <b>no rush</b>`
      :`wait and you drop to <b>${esc(r.nxt.n)}</b> (${r.nxt.a.toFixed(0)}) — <b>${r.delta.toFixed(0)} spots</b>`;
    const val=r.edge>=0?`<span class="edge-pos">${r.edge.toFixed(0)} spots of value</span>`
      :`<span class="edge-neg">reaching ${(-r.edge).toFixed(0)}</span>`;
    return `<div class="rec${i?'':' top'}"><div class="rank">${i+1}</div><div class="rec-main">
      <div class="rec-name"><span class="badge b-${r.p.p}">${r.p.p}</span>${esc(r.p.n)}</div>
      <div class="rec-why">ADP ${r.p.a.toFixed(0)} · ${val} · ${wait}</div></div>
      <button class="take mini" data-take="${esc(r.p.n)}">Draft</button></div>`}).join('')
    ||'<div class="rec"><div class="rec-main"><div class="rec-why">Board is empty.</div></div></div>';

  // scarcity
  const gap=horizon();
  document.getElementById('scar').innerHTML=['QB','RB','WR','TE'].map(pos=>{
    const a=avail().filter(p=>p.p===pos),tierN=a.filter(p=>p.a<=(pos==='QB'?45:pos==='TE'?110:90)).length;
    const surv=avail().slice(gap).filter(p=>p.p===pos&&p.a<=(pos==='QB'?45:pos==='TE'?110:90)).length;
    const pct=Math.min(100,tierN/(pos==='WR'?20:pos==='RB'?16:12)*100);
    const col=tierN<=2?'var(--neg)':tierN<=5?'var(--hot)':'var(--pos)';
    return `<div class="scar"><div class="scar-hd"><span><span class="badge b-${pos}">${pos}</span> ${tierN} left in tier</span>
      <b style="color:${col}">${surv} survive</b></div>
      <div class="meter"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="scar-note">${surv===0?'<span class="warnTxt">Gone before your next pick.</span>'
        :surv===1?`Only one should reach pick ${f??'—'}.`:`${surv} should still be there at pick ${f??'—'}.`}</div></div>`}).join('');

  // roster
  const {slots,bench}=fill(mine());
  document.getElementById('roster').innerHTML=slots.map(s=>
    `<div class="slotrow"><span class="slotlab">${s.s}</span>${s.p
      ?`<span class="badge b-${s.p.p}">${s.p.p}</span><span>${esc(s.p.n)}</span><span class="spacer"></span><span class="mono" style="color:var(--faint);font-size:11px">${s.p.a.toFixed(0)}</span>`
      :'<span class="empty">open</span>'}</div>`).join('');
  document.getElementById('bench').innerHTML=bench.length
    ?bench.map(p=>`<div class="slotrow"><span class="badge b-${p.p}">${p.p}</span><span>${esc(p.n)}</span><span class="spacer"></span><span class="mono" style="color:var(--faint);font-size:11px">${p.a.toFixed(0)}</span></div>`).join('')
    :`<div class="slotrow"><span class="empty">empty — ${D.bench} spots</span></div>`;

  // filters
  document.getElementById('filters').innerHTML=['ALL','QB','RB','WR','TE','PK','DEF'].map(x=>
    `<button class="mini${S.filter===x?' on':''}" data-f="${x}">${x}</button>`).join(' ');

  // table
  const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=P.filter(p=>{
    if(S.hide&&S.drafted[p.n])return false;
    if(S.filter!=='ALL'&&p.p!==S.filter)return false;
    if(q&&!p.n.toLowerCase().includes(q)&&!p.t.toLowerCase().includes(q))return false;
    return true}).sort((a,b)=>a.a-b.a).slice(0,300);
  document.getElementById('tb').innerHTML=rows.map(p=>{
    const st=S.drafted[p.n],e=S.pick-p.a;
    return `<tr class="row ${st==='me'?'mineRow':''} ${st?'gone':''}" data-n="${esc(p.n)}">
      <td><span class="badge b-${p.p}">${p.p}</span>${esc(p.n)}</td>
      <td>${p.t}</td><td>${p.b??'—'}</td><td>${p.a.toFixed(1)}</td>
      <td class="${e>=0?'edge-pos':'edge-neg'}">${e>=0?'+':''}${e.toFixed(0)}</td>
      <td>${st?(st==='me'?'yours':'gone'):`<button class="mini" data-me="${esc(p.n)}">mine</button>`}</td></tr>`}).join('');

  document.getElementById('foot').innerHTML=
    `Click a row to mark a player gone. <kbd>Enter</kbd> in search marks the top hit gone; <kbd>Shift</kbd>+<kbd>Enter</kbd> drafts him to you. `+
    `Values are ${esc(D.meta.src)}. Keepers shown are <em>modelled</em> — replace with the real list once declared. State saves in this browser.`;
}
/* ---- events ---- */
addEventListener('click',e=>{
  const t=e.target.closest('[data-take]')||e.target.closest('[data-me]');
  if(t){mark(t.dataset.take||t.dataset.me,'me');e.stopPropagation();return}
  const f=e.target.closest('[data-f]');
  if(f){S.filter=f.dataset.f;save();render();return}
  const r=e.target.closest('tr.row');
  if(r&&!S.drafted[r.dataset.n]){mark(r.dataset.n,'them')}
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const first=document.querySelector('#tb tr.row:not(.gone)');
  if(!first)return;
  mark(first.dataset.n,e.shiftKey?'me':'them');
  document.getElementById('q').value='';render();
});
bUndo.onclick=undo;
bHide.onclick=()=>{S.hide=!S.hide;save();render()};
bMock.onclick=()=>{S.mock=!S.mock;S.drafted={};S.hist=[];S.pick=1;save();render()};
bReset.onclick=()=>{if(confirm('Clear the whole board and start over?')){S.drafted={};S.hist=[];S.pick=1;save();render()}};
bKeep.onclick=()=>{
  D.keepers.forEach(k=>{if(byName.has(k.n)&&!S.drafted[k.n])S.drafted[k.n]='them'});
  D.mine.forEach(n=>{if(byName.has(n))S.drafted[n]='me'});
  save();render();
};
render();
</script>
