<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebras Draft Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f5;--surface:#fff;--surface-2:#e9eeed;--line:#dbe2e0;
  --text:#111819;--muted:#5b686b;--faint:#8b989b;
  --accent:#0d6b5a;--hot:#a8720a;--hot-bg:#fdf1d8;
  --pos:#127a5c;--neg:#c03b52;--mine:#0d6b5a;--mine-bg:#dff0ea;
  --qb:#c9445c;--rb:#17936a;--wr:#3a7fd0;--te:#c4762a;--pk:#7b6ad0;--def:#5c7078;--rise:#c2571f;
  --shadow:0 1px 2px rgba(17,24,25,.05),0 4px 16px rgba(17,24,25,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1214;--surface:#151d20;--surface-2:#1c262a;--line:#28343a;
  --text:#e5ecea;--muted:#8fa0a4;--faint:#6b7c81;
  --accent:#3cbb9c;--hot:#f0b429;--hot-bg:#3a2d0e;
  --pos:#3ed19c;--neg:#f0798c;--mine:#3cbb9c;--mine-bg:#123029;
  --qb:#e8697f;--rb:#2fc48d;--wr:#5f9fe8;--te:#e8963f;--pk:#a08ce8;--def:#8fa3ab;--rise:#f08a4b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0d1214;--surface:#151d20;--surface-2:#1c262a;--line:#28343a;
  --text:#e5ecea;--muted:#8fa0a4;--faint:#6b7c81;
  --accent:#3cbb9c;--hot:#f0b429;--hot-bg:#3a2d0e;
  --pos:#3ed19c;--neg:#f0798c;--mine:#3cbb9c;--mine-bg:#123029;
  --qb:#e8697f;--rb:#2fc48d;--wr:#5f9fe8;--te:#e8963f;--pk:#a08ce8;--def:#8fa3ab;--rise:#f08a4b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 64px;display:flex;flex-direction:column;gap:16px}

/* status bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-wrap:wrap;
  align-items:center;gap:10px 20px}
.bar.clock{border-color:var(--hot);background:var(--hot-bg)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.clockmsg{font-weight:700;font-size:16px;color:var(--hot);letter-spacing:-.01em}
.spacer{flex:1 1 auto}
button{font-family:inherit;font-size:12px;font-weight:500;padding:6px 11px;border-radius:5px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.warn:hover{border-color:var(--neg);color:var(--neg)}
button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* sync */
.pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.pill.off{color:var(--faint)}
.pill.live{color:var(--pos);border-color:var(--pos)}
.pill.live::before{content:"● "}
.pill.stale{color:var(--hot);border-color:var(--hot)}
.pill.stale::before{content:"◐ "}
.pill.warn{color:var(--neg);border-color:var(--neg)}
.pill.warn::before{content:"▲ "}
.banner{background:var(--hot-bg);border:1px solid var(--hot);color:var(--text);border-radius:8px;
  padding:10px 16px;font-size:13px;box-shadow:var(--shadow)}
.banner b{font-weight:600}
.diag{display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.card h2{margin:0;padding:11px 16px;font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:16px}

/* recs */
.rec{display:flex;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.rec:last-child{border-bottom:none}
.rec.top{background:var(--hot-bg)}
.rank{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--faint);width:14px;flex:none;padding-top:3px}
.rec-main{flex:1;min-width:0}
.rec-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.rec-why{font-size:12.5px;color:var(--muted);margin-top:3px}
.rec-why b{color:var(--text);font-weight:600}
.take{flex:none;align-self:center}

/* table */
.tools{display:flex;flex-wrap:wrap;gap:7px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
input[type=search]{flex:1;min-width:150px;font-family:inherit;font-size:13px;padding:7px 10px;
  border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.board{max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;
  padding:7px 9px;border-bottom:1px solid var(--line);z-index:2}
th:first-child{text-align:left;padding-left:14px}
td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
td:first-child{text-align:left;padding-left:14px;font-family:Archivo,sans-serif;color:var(--text);font-weight:500}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.gone td{opacity:.34;text-decoration:line-through}
tr.mineRow td{background:var(--mine-bg)}
tr.mineRow td:first-child{box-shadow:inset 3px 0 0 var(--mine)}
.badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  padding:2px 4px;border-radius:2px;color:#fff;margin-right:7px;min-width:27px;text-align:center}
.b-QB{background:var(--qb)}.b-RB{background:var(--rb)}.b-WR{background:var(--wr)}
.b-TE{background:var(--te)}.b-PK{background:var(--pk)}.b-DEF{background:var(--def)}
.mini{font-size:10px;padding:2px 6px;border-radius:4px}
.edge-pos{color:var(--pos);font-weight:600}.edge-neg{color:var(--neg)}
.fitbar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;vertical-align:middle}
.fitbar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* roster + scarcity */
.slotrow{display:flex;align-items:center;gap:9px;padding:6px 16px;border-bottom:1px solid var(--line);font-size:13px}
.slotrow:last-child{border-bottom:none}
.slotlab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;color:var(--faint);width:74px;flex:none}
.empty{color:var(--faint);font-style:italic}
.scar{padding:9px 16px;border-bottom:1px solid var(--line)}
.scar:last-child{border-bottom:none}
.scar-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.scar-hd b{font-family:"IBM Plex Mono",monospace;font-size:12px}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.scar-note{font-size:11.5px;color:var(--faint);margin-top:4px}
.warnTxt{color:var(--neg);font-weight:600}
.tierchip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:10px;
  border:1px solid var(--line);color:var(--muted);vertical-align:middle;margin-left:4px}
.depth{color:var(--faint);font-style:italic}
/* tier in the board: the number, plus how many of that tier are still on the
   board — "2 · 3 left" is the thing you act on, a bare number is not */
.tno{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--text)}
.tleft{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-left:4px}
.tlast .tleft{color:var(--neg)}
/* last man in his tier — after him the market says there is a cliff */
tr.tlast td{border-bottom:1px solid var(--neg)}
.buzzchip,.rookiechip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:10px;
  vertical-align:middle;margin-left:4px}
.buzzchip{color:var(--rise);border:1px solid var(--rise)}
.rookiechip{color:var(--accent);border:1px solid var(--accent)}
.risebar{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.risebar:last-child{border-bottom:none}
.risebar:hover{background:var(--surface-2)}
.rise-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
/* around the room */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1px;background:var(--line)}
.opp{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.opp.soon{background:var(--hot-bg)}
.opp.me{box-shadow:inset 3px 0 0 var(--mine)}
.opp-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.opp-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-when{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);white-space:nowrap}
.opp-counts{display:flex;flex-wrap:wrap;gap:4px}
.cnt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;padding:2px 5px;
  border-radius:2px;color:#fff}
.cnt.zero{background:var(--surface-2)!important;color:var(--faint)}
.opp-need{font-size:11px;color:var(--muted)}
.opp-need b{color:var(--text);font-weight:600}
footer{font-size:11.5px;color:var(--faint);line-height:1.6;padding-top:6px}
kbd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;background:var(--surface-2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="bar" id="bar">
    <div class="stat"><b id="sPick">1</b><span>pick now</span></div>
    <div class="stat"><b id="sNext">2</b><span>your next</span></div>
    <div class="stat"><b id="sGap">—</b><span>picks away</span></div>
    <div class="stat"><b id="sLeft">14</b><span>your picks left</span></div>
    <div id="clockMsg" class="clockmsg"></div>
    <div class="spacer"></div>
    <span id="syncPill" class="pill off">offline</span>
    <button id="bSync">Connect draft</button>
    <button id="bKeep">Pre-mark keepers</button>
    <button id="bMock">Mock mode</button>
    <button id="bUndo">Undo</button>
    <button id="bReset" class="warn">Reset</button>
  </div>
  <div id="syncBanner" class="banner" hidden></div>

  <div class="grid">
    <div class="stack">
      <div class="card">
        <h2>Take one of these</h2>
        <div id="recs"></div>
      </div>
      <div class="card">
        <h2>Player board</h2>
        <div class="tools">
          <input type="search" id="q" placeholder="Search — Enter marks top hit gone, Shift+Enter drafts him for you" autocomplete="off">
          <span id="filters"></span>
          <button id="bHide" class="mini on">Hide drafted</button>
        </div>
        <div class="board"><table>
          <thead><tr><th>Player</th><th>Tm</th><th>Bye</th><th>Tier</th><th>ADP</th><th>VOR</th><th>vs pick</th><th>Fit</th><th></th></tr></thead>
          <tbody id="tb"></tbody>
        </table></div>
      </div>
    </div>

    <div class="stack">
      <div class="card"><h2>Positional runway</h2><div id="scar"></div></div>
      <div class="card" id="risingCard" hidden><h2>Rising — market moving now</h2><div id="rising"></div></div>
      <div class="card"><h2>Your roster</h2><div id="roster"></div></div>
      <div class="card"><h2>Bench</h2><div id="bench"></div></div>
    </div>
  </div>

  <div class="card" id="oppCard" hidden>
    <h2>Around the room</h2>
    <div id="opps" class="opps"></div>
  </div>

  <footer id="foot"></footer>
</div>

  for (let r = 1; r <= rounds; r++) a.push((r - 1) * teams + (r % 2 ? slot : teams - slot + 1));

function fill(list) {
  const slots = D.slots.map(s => ({ s, p: null }));
  const pool = [...list].sort((a, b) => a.a - b.a);
  const grab = t => { const i = pool.findIndex(p => t.includes(p.p)); return i < 0 ? null : pool.splice(i, 1)[0]; };
  // the lineup calls the slot K; the ADP feed calls the position PK. Without
  // this the kicker slot never fills and the model keeps asking for another.
  const eligible = s => (s === 'K' ? ['K', 'PK'] : [s]);
  for (const sl of slots) if (!['FLEX', 'SUPER_FLEX'].includes(sl.s)) sl.p = grab(eligible(sl.s));
  for (const sl of slots) if (sl.s === 'FLEX') sl.p = grab(FLEX);
  for (const sl of slots) if (sl.s === 'SUPER_FLEX') sl.p = grab(SF);
  return { slots, bench: pool };
}

/* How many lineup slots a position could ever occupy. Two quarterbacks fill
   QB and SUPER_FLEX in this league, and a third starts nowhere. */
function startableSlots(pos) {
  return D.slots.filter(s =>
    s === pos
    || (s === 'K' && pos === 'PK')
    || (s === 'FLEX' && FLEX.includes(pos))
    || (s === 'SUPER_FLEX' && SF.includes(pos))).length;
}

/* Need is a positive weight in [0,1]. Anything at or above STARTER_NEED fills
   a hole in the starting lineup; below it the pick is bench depth. */
const STARTER_NEED = 0.5;

function needFor(roster, pos, picksLeft) {
  const { slots } = fill(roster);
  const open = s => slots.some(x => x.s === s && !x.p);
  if (pos === 'PK' || pos === 'DEF') {
    const slot = pos === 'PK' ? 'K' : 'DEF';
    // a kicker is only ever the last thing you do
    return open(slot) ? (picksLeft <= 3 ? 1 : 0.02) : 0.01;
  }
  if (open(pos)) return 1;
  if (FLEX.includes(pos) && open('FLEX')) return 0.85;
  if (SF.includes(pos) && open('SUPER_FLEX')) return pos === 'QB' ? 0.95 : 0.75;

  // every slot this position can start in is taken; from here it is depth
  const depth = roster.filter(p => p.p === pos).length;
  const surplus = Math.max(0, depth - startableSlots(pos));
  return Math.max(0.02, 0.14 / (1 + surplus));
}

const needWeight = pos => needFor(mine(), pos, myPicks().filter(x => x >= S.pick).length);

/* Which lineup slot this position would actually fill, or null for depth.
   Shown on every recommendation so the reasoning is visible. */
function fillsSlot(roster, pos) {
  const { slots } = fill(roster);
  const open = s => slots.some(x => x.s === s && !x.p);
  if (pos === 'PK') return open('K') ? 'K' : null;
  if (pos === 'DEF') return open('DEF') ? 'DEF' : null;
  if (open(pos)) return pos;
  if (FLEX.includes(pos) && open('FLEX')) return 'FLEX';
  if (SF.includes(pos) && open('SUPER_FLEX')) return 'SUPER_FLEX';
  return null;
}

/* ---- tiers ---------------------------------------------------------------
   A tier is a run of players the market treats as interchangeable. Break the
   run where the gap to the next player is large relative to how precisely the
   market has ranked them — the stdev of their ADP is exactly that measure, and
   FFC gives it to us per player. */
const TIERS = (() => {
  const out = new Map();
  for (const pos of ['QB', 'RB', 'WR', 'TE', 'PK', 'DEF']) {
    const list = P.filter(p => p.p === pos).sort((a, b) => a.a - b.a);
    let tier = 1;
    list.forEach((p, i) => {
      if (i > 0) {
        const prev = list[i - 1];
        const spread = ((prev.sd || 6) + (p.sd || 6)) / 2;
        if (p.a - prev.a > Math.max(4, spread * 0.9)) tier++;
      }
      out.set(p.n, tier);
    });
  }
  return out;
})();
const tierOf = p => TIERS.get(p.n) || 0;

/* ---- buzz ----------------------------------------------------------------
   ADP is a lagging average — by the time a breakout shows up in it, the price
   has already moved. Two independent live signals catch the move in progress:
   how fast a player's ADP is climbing, and how hard he is being added across
   Sleeper. Neither is trustworthy alone; both pointing the same way is.

   This is deliberately NOT allowed to drive a pick. It breaks ties inside a
   tier and it fills the Rising panel. Need and scarcity still decide. */
const ADD_MAX = Math.max(1, ...P.map(p => p.add || 0));
function buzz(p) {
  const climb = Math.min(1, Math.max(0, p.vel || 0) / 18);   // 18 spots ~ maxed
  const adds = Math.min(1, (p.add || 0) / ADD_MAX);
  if (!climb && !adds) return 0;
  // reward corroboration: agreeing signals score far above one loud one
  const hi = Math.max(climb, adds), lo = Math.min(climb, adds);
  return Math.round(Math.min(100, 100 * (0.6 * hi + 0.4 * lo)));
}
const isRookie = p => !!p.rk;

/* ---- fit: need x value ---------------------------------------------------
   The board used to be sorted by ADP alone, which answers "who is best" and
   not "who is best *for me*". Value here is points above replacement under
   this league's own scoring, so a quarterback is measured against the 24 who
   start in superflex rather than against the 12 who start elsewhere. Need
   squares, as in the recommendations, so a position you have filled has to be
   far better to outrank one you have not. */
const VOR_MAX = Math.max(1, ...P.map(p => p.vor || 0));
function fitScore(p, roster, left, surv) {
  const need = needFor(roster, p.p, left);
  const value = Math.max(0, p.vor || 0) / VOR_MAX;      // 0..1
  const gone = surv && !surv.includes(p) ? 1.25 : 1;     // won't last to your next pick
  const bz = 1 + 0.12 * buzz(p) / 100;
  return need * need * value * gone * bz;
}

/* The tier the next player at this position belongs to, and what is left of
   it — "3 left in QB tier 4" is the thing you can actually act on. */
function tierState(pos, board, surv) {
  const next = board.find(p => p.p === pos);
  if (!next) return null;
  const t = tierOf(next);
  const inTier = board.filter(p => p.p === pos && tierOf(p) === t);
  const survives = surv.filter(p => p.p === pos && tierOf(p) === t).length;
  return { tier: t, next, left: inTier.length, survives, members: inTier };
}

/* ---- who is left when you next pick -------------------------------------- */

function survivors() {
  const board = avail();
  const gap = horizon();
  if (gap <= 0 || gap >= 900) return board;
  // no live rosters means no need signal — fall back to straight ADP order
  if (typeof liveRosters !== 'function' || !liveRosters()) return board.slice(gap);

  const pool = [...board];
  const since = new Map();               // roster_id -> what it took inside this window
  const from = S.pick + (onClock() ? 1 : 0);
  for (let n = 0; n < gap && pool.length; n++) {
    const at = from + n;
    const rid = typeof ownerOfPick === 'function' ? ownerOfPick(at) : null;
    const roster = (rosterForPick(at) || []).concat(since.get(rid) || []);
    const left = Math.max(1, D.rounds - Math.ceil(at / D.teams) + 1);

    /* Compare the best player at each position rather than the first N on the
       board. In superflex the top of the board goes QB-heavy, so a fixed
       window can contain nothing but quarterbacks — and a team that is set at
       QB would then be modelled as taking one anyway. */
    let best = 0, bestScore = -Infinity;
    const seen = new Set();
    for (let i = 0; i < pool.length && seen.size < 6; i++) {
      const pos = pool[i].p;
      if (seen.has(pos)) continue;
      seen.add(pos);
      const score = needFor(roster, pos, left) / (1 + i * 0.05);
      if (score > bestScore) { bestScore = score; best = i; }
    }
    const taken = pool.splice(best, 1)[0];
    if (rid != null) {
      if (!since.has(rid)) since.set(rid, []);
      since.get(rid).push(taken);
    }
  }
  return pool;
}

/* ---- recommendations ----------------------------------------------------- */

function computeRecs() {
  const board = avail(), surv = survivors();
  const left = myPicks().filter(x => x >= S.pick).length;
  const roster = mine();
  const out = [];

  for (const pos of ['QB', 'RB', 'WR', 'TE', 'PK', 'DEF']) {
    const now = board.find(p => p.p === pos);
    if (!now) continue;
    const nxt = surv.find(p => p.p === pos);
    const need = needFor(roster, pos, left);
    const ts = tierState(pos, board, surv);

    // urgency: how far you fall by waiting. Never negative.
    const urgency = nxt ? Math.max(0, nxt.a - now.a) : 140;
    // bargain: only counts when he is genuinely late for his price. Never negative.
    const bargain = Math.max(0, S.pick - now.a);
    // a whole tier about to vanish is the sharpest signal there is
    const tierRisk = ts && ts.survives === 0 ? 14 : ts && ts.survives === 1 ? 6 : 0;

    // squared so need dominates: a filled position has to be enormously more
    // urgent to outrank an open one, rather than merely somewhat more urgent
    // buzz nudges by at most 18% — enough to separate two similar players,
    // never enough to pull a position you do not need to the top
    const bz = buzz(now);
    const score = need * need * (2 + urgency + 0.5 * bargain + tierRisk) * (1 + 0.18 * bz / 100);
    out.push({
      p: now, pos, need, urgency, bargain, nxt, score, tier: ts, buzz: bz,
      fills: fillsSlot(roster, pos),
      starter: need >= STARTER_NEED,
    });
  }

  out.sort((a, b) => b.score - a.score || a.p.a - b.p.a);

  /* Hard rule, not a weighting: while any position still fills a hole in the
     starting lineup, depth picks are not recommendations. This is what stops
     a third quarterback being suggested all afternoon. */
  const starters = out.filter(r => r.starter);
  return (starters.length ? starters : out).slice(0, 3);
}


/* ===== sleeper.js ===== */
/* sleeper.js — read the draft board straight from Sleeper.

   Sleeper serves this API with `access-control-allow-origin: *`, so the browser
   can talk to it directly and the app needs no backend at all. Two wrinkles:

   - Responses sit behind a 30-second CDN cache (`s-maxage=30`), which is too
     stale to draft against. A nonce in the query string forces a cache MISS.
   - That would make every poll a full download, so we pair it with
     `If-None-Match`. Unchanged boards come back as a 304 with no body.

   With a 90-second pick timer, polling every 4-10s is responsive and costs
   well under Sleeper's documented 1000 requests/minute. */

const API = 'https://api.sleeper.app/v1';

const SYNC = {
  on: false, degraded: false, draftId: null, draft: null,
  etag: null, picks: [], err: 0, timer: null, lastAt: 0,
  myRosterId: null,
  ownerOf: new Map(),   // overall pick -> roster_id that owns it
  rosters: new Map(),   // roster_id -> [player objects drafted so far]
  teamName: new Map(),
  note: '',
  // measured, so the next outage is diagnosed rather than guessed at
  stats: { polls: 0, forced: 0, errors: 0, notModified: 0, lastErr: '', lastMs: 0, maxMs: 0 }
};

/* sync is the source of truth unless it has fallen over */
const syncAuthoritative = () => SYNC.on && !SYNC.degraded;
const liveRosters = () => SYNC.on && SYNC.ownerOf.size > 0;

const TIMEOUT_MS = 15000;   // phones on stadium wifi are slow, not broken
const DEGRADE_AFTER = 5;    // consecutive misses before crying wolf
const DEGRADE_QUIET_MS = 45000;  // ...and only if it has been bad this long

/* Forcing a CDN miss on every poll means every request hits the origin. That
   is worth it when a pick is imminent and 30s of staleness would matter; it is
   just noise and extra failure surface when your turn is twenty picks away. */
const FRESH_WITHIN = 3;   // picks. Your picks sit ~12 apart, so a wider window
                          // would force an origin hit on most polls and buy
                          // nothing: 3 picks is still minutes of warning.
function freshnessNonce() {
  const n = nextPick();
  const near = n === null || (n - S.pick) <= FRESH_WITHIN;
  if (near) SYNC.stats.forced++;
  return near ? Date.now().toString(36) + Math.random().toString(36).slice(2, 7) : null;
}

/* A request that never settles is worse than one that fails: without a
   deadline the app sits on "offline" forever and never says why. */
async function api(path, opts = {}) {
  const nonce = opts.nonce === undefined ? (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)) : opts.nonce;
  const url = nonce ? `${API}${path}${path.includes('?') ? '&' : '?'}_=${nonce}` : `${API}${path}`;
  const headers = opts.etag ? { 'If-None-Match': opts.etag } : {};
  const ctrl = new AbortController();
  const bell = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  let r;
  const t0 = Date.now();
  try {
    r = await fetch(url, { headers, signal: ctrl.signal });
    SYNC.stats.lastMs = Date.now() - t0;
    SYNC.stats.maxMs = Math.max(SYNC.stats.maxMs, SYNC.stats.lastMs);
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? `${path.split('?')[0]} timed out after ${TIMEOUT_MS / 1000}s`
      : `${path.split('?')[0]} unreachable`);
  } finally {
    clearTimeout(bell);
  }
  if (r.status === 304) return { status: 304 };
  if (!r.ok) throw new Error(`${path.split('?')[0]} → HTTP ${r.status}`);
  return { status: r.status, etag: r.headers.get('etag'), data: await r.json() };
}

/* ---- discovery ---------------------------------------------------------- */

async function discoverDraft() {
  const q = new URLSearchParams(location.search);
  if (q.get('draft')) return q.get('draft');
  const league = q.get('league') || D.leagueId;
  if (league) {
    try {
      const drafts = (await api(`/league/${league}/drafts`)).data || [];
      const live = drafts.find(d => d.status === 'drafting') || drafts[0];
      if (live) return live.draft_id;
    } catch (e) { /* fall through to the configured draft */ }
  }
  return D.draftId || null;
}

/* ---- who owns which pick ------------------------------------------------ */

/* Which draft slot picks at a given overall pick. */
function slotAt(n, draft) {
  const set = draft.settings || {};
  const teams = set.teams || D.teams;
  const round = Math.ceil(n / teams);
  const inRound = n - (round - 1) * teams;
  let reversed = draft.type === 'snake' && round % 2 === 0;
  // third-round reversal and friends flip the snake from a given round on
  const rev = set.reversal_round || 0;
  if (rev && round >= rev) reversed = !reversed;
  return { round, slot: reversed ? teams - inRound + 1 : inRound };
}

function buildOwnership(draft, traded) {
  const set = draft.settings || {};
  const teams = set.teams || D.teams, rounds = set.rounds || D.rounds;
  const slotToRoster = draft.slot_to_roster_id || {};
  const moved = new Map();
  for (const t of traded || []) moved.set(`${t.round}:${t.roster_id}`, t.owner_id);

  const own = new Map();
  for (let n = 1; n <= teams * rounds; n++) {
    const { round, slot } = slotAt(n, draft);
    // a mock has no roster ids, so fall back to the slot number itself
    const original = slotToRoster[slot] ?? slotToRoster[String(slot)] ?? slot;
    own.set(n, moved.get(`${round}:${original}`) ?? original);
  }
  return own;
}

/* Roster shape straight from the draft, so a mock with different settings is
   scored against its own lineup rather than our league's. */
function slotsFromDraft(set) {
  const out = [];
  const push = (n, label) => { for (let i = 0; i < (n || 0); i++) out.push(label); };
  push(set.slots_qb, 'QB'); push(set.slots_rb, 'RB'); push(set.slots_wr, 'WR');
  push(set.slots_te, 'TE'); push(set.slots_flex, 'FLEX');
  push(set.slots_super_flex, 'SUPER_FLEX'); push(set.slots_k, 'K'); push(set.slots_def, 'DEF');
  return out.length ? out : null;
}

/* Roster a team holds at the moment — used by the need-aware simulation. */
const ownerOfPick = n => SYNC.ownerOf.get(n) ?? null;
function rosterForPick(n) {
  const rid = ownerOfPick(n);
  return rid == null ? null : (SYNC.rosters.get(rid) || []);
}

/* ---- applying picks ----------------------------------------------------- */

function pickName(pk) {
  const byIdName = byId.get(String(pk.player_id));
  if (byIdName) return byIdName;
  const m = pk.metadata || {};
  const joined = [m.first_name, m.last_name].filter(Boolean).join(' ').trim();
  return joined || null;
}

/* Rebuilt from scratch each poll rather than accumulated, so a dropped poll or
   a reverted pick can never leave the board out of step with Sleeper. */
function applyPicks(picks) {
  SYNC.picks = picks;
  SYNC.rosters = new Map();
  S.drafted = {};
  S.hist = [];
  let unknown = 0;
  const made = new Set();

  for (const pk of picks) {
    if (pk.pick_no) made.add(pk.pick_no);
    const rid = pk.roster_id ?? SYNC.ownerOf.get(pk.pick_no);
    const name = pickName(pk);
    if (!name || !byName.has(name)) { unknown++; continue; }
    S.drafted[name] = rid === SYNC.myRosterId ? 'me' : 'them';
    if (!SYNC.rosters.has(rid)) SYNC.rosters.set(rid, []);
    SYNC.rosters.get(rid).push(byName.get(name));
  }

  // Keepers are pre-placed at their own pick numbers, so the board is not
  // necessarily contiguous — the live pick is the first slot nobody has used.
  let n = 1;
  while (made.has(n)) n++;
  S.pick = n;
  SYNC.made = made;
  SYNCED_MADE = made;
  SYNC.note = unknown ? `${unknown} pick${unknown > 1 ? 's' : ''} outside the ranked pool` : '';
  save();
}

/* ---- polling ------------------------------------------------------------ */

/* `sticky` marks a banner that a healthy poll must not clear — the slot
   prompt is a question for the user, not a transient network complaint. */
function setBanner(html, sticky) {
  const b = el('syncBanner');
  if (!html) {
    if (SYNC.sticky) return;
    b.hidden = true; b.innerHTML = '';
    return;
  }
  SYNC.sticky = !!sticky;
  b.hidden = false;
  b.innerHTML = html;
}

async function pollOnce() {
  SYNC.stats.polls++;
  try {
    const r = await api(`/draft/${SYNC.draftId}/picks`, { etag: SYNC.etag, nonce: freshnessNonce() });
    SYNC.err = 0;
    SYNC.degraded = false;
    SYNC.lastAt = Date.now();
    setBanner('');
    if (r.status === 304) { SYNC.stats.notModified++; renderSync(); return false; }
    SYNC.etag = r.etag;
    applyPicks(r.data || []);
    render();
    return true;
  } catch (e) {
    SYNC.err++;
    SYNC.stats.errors++;
    SYNC.stats.lastErr = e.message;
    /* A blip is not an outage. The board on screen is still the last good one,
       so say nothing until it has genuinely been failing for a while. */
    const quiet = SYNC.lastAt ? Date.now() - SYNC.lastAt : Infinity;
    if (SYNC.err >= DEGRADE_AFTER && quiet > DEGRADE_QUIET_MS && !SYNC.degraded) {
      SYNC.degraded = true;
      SYNC.sticky = false;
      const st = SYNC.stats;
      setBanner(`<b>Lost contact with Sleeper</b> — ${esc(e.message)}. `
        + 'The board below is the last one we saw. Marking picks by hand works again in the meantime, '
        + 'and it re-syncs on its own when the connection comes back. '
        + `<span class="diag">${st.errors} failed of ${st.polls} polls · slowest ${(st.maxMs / 1000).toFixed(1)}s</span>`);
    }
    renderSync();
    return false;
  }
}

function pollDelay() {
  // back off gently, with jitter so a flaky link does not resynchronise into
  // a burst of simultaneous retries
  if (SYNC.err) return Math.min(30000, 3000 * 1.6 ** (SYNC.err - 1)) * (0.85 + Math.random() * 0.3);
  if (SYNC.draft && SYNC.draft.status === 'complete') return null;
  const away = (nextPick() ?? 999) - S.pick;
  return away <= 6 ? 4000 : 10000;
}

function loop() {
  clearTimeout(SYNC.timer);
  const d = pollDelay();
  if (d === null) return;
  SYNC.timer = setTimeout(async () => { await pollOnce(); loop(); }, d);
}

/* ---- boot --------------------------------------------------------------- */

async function startSync() {
  let id;
  try { id = await discoverDraft(); } catch (e) { id = null; }
  if (!id) { renderSync(); return; }
  SYNC.draftId = id;

  try {
    SYNC.draft = (await api(`/draft/${id}`)).data;
  } catch (e) {
    setBanner(`<b>Could not open draft ${esc(id)}</b> — ${esc(e.message)}. Marking picks by hand still works.`);
    renderSync();
    return;
  }

  let traded = [];
  try { traded = (await api(`/draft/${id}/traded_picks`)).data || []; } catch (e) {}
  SYNC.ownerOf = buildOwnership(SYNC.draft, traded);

  /* Adopt the draft's own shape. A mock can have a different team count,
     round count and lineup than our league, and scoring it against our
     roster slots would give confidently wrong advice. */
  const set = SYNC.draft.settings || {};
  if (set.teams) D.teams = set.teams;
  if (set.rounds) D.rounds = set.rounds;
  const shape = slotsFromDraft(set);
  if (shape) { D.slots = shape; D.bench = set.slots_bn ?? D.bench; }

  /* Which team is ours. A league draft knows from draft_order; a mock you
     joined anonymously does not, so ?slot=N settles it. */
  const q = new URLSearchParams(location.search);
  const forced = parseInt(q.get('slot'), 10);
  const slotMap = SYNC.draft.slot_to_roster_id || {};
  let mySlot = (SYNC.draft.draft_order || {})[D.myUserId];
  if (!mySlot && forced >= 1 && forced <= (set.teams || D.teams)) mySlot = forced;
  SYNC.mySlot = mySlot || null;
  SYNC.myRosterId = mySlot ? (slotMap[mySlot] ?? slotMap[String(mySlot)] ?? mySlot) : null;

  if (SYNC.myRosterId != null) {
    SYNC.owned = [...SYNC.ownerOf.entries()]
      .filter(([, rid]) => rid === SYNC.myRosterId)
      .map(([n]) => n).sort((a, b) => a - b);
    SYNCED_PICKS = SYNC.owned;
  } else {
    setBanner('<b>Which team is yours?</b> This draft does not list your Sleeper account, '
      + 'which is normal for a mock. Pick your draft slot so the recommendations know when you are up — '
      + '<button id="bSlot" class="mini">choose slot</button>', true);
    const btn = el('bSlot');
    if (btn) btn.onclick = () => {
      const v = prompt(`Your draft slot, 1 to ${set.teams || D.teams}:`, '');
      const n = parseInt(v, 10);
      if (!(n >= 1)) return;
      const p = new URLSearchParams(location.search);
      p.set('slot', String(n));
      location.search = p.toString();
    };
  }

  // team names are a nicety and absent from standalone mocks
  const lid = SYNC.draft.league_id;
  if (lid) {
    try {
      const users = (await api(`/league/${lid}/users`)).data || [];
      const rosters = (await api(`/league/${lid}/rosters`)).data || [];
      const uname = new Map(users.map(u => [u.user_id, (u.metadata || {}).team_name || u.display_name]));
      rosters.forEach(r => SYNC.teamName.set(r.roster_id, uname.get(r.owner_id) || `Roster ${r.roster_id}`));
    } catch (e) {}
  }

  SYNC.on = true;
  el('bKeep').hidden = true;   // keepers arrive as picks now; no need to model them
  el('bMock').hidden = true;   // pick list comes from the draft itself
  await pollOnce();
  loop();
}

function renderSync() {
  const pill = el('syncPill');
  if (!SYNC.on) { pill.className = 'pill off'; pill.textContent = 'offline'; return; }
  if (SYNC.degraded) { pill.className = 'pill warn'; pill.textContent = 'retrying'; return; }
  const status = (SYNC.draft && SYNC.draft.status) || '';
  const age = SYNC.lastAt ? Math.round((Date.now() - SYNC.lastAt) / 1000) : null;
  // only mention staleness once it is worth mentioning
  const ago = age !== null && age >= 25 ? ` · ${age}s ago` : '';
  pill.className = SYNC.err ? 'pill stale' : 'pill live';
  pill.textContent = status === 'complete' ? 'draft complete'
    : `live · ${SYNC.picks.length} picks${ago}${SYNC.note ? ' · ' + SYNC.note : ''}`;
  const st = SYNC.stats;
  pill.title = `${st.polls} polls, ${st.errors} failed, ${st.notModified} unchanged, `
    + `${st.forced} forced fresh\nlast ${st.lastMs}ms, slowest ${st.maxMs}ms`
    + (st.lastErr ? `\nlast error: ${st.lastErr}` : '');
}

function goToDraft(id) {
  const q = new URLSearchParams(location.search);
  if (id) q.set('draft', id); else q.delete('draft');
  q.delete('slot');                       // a different draft means a different seat
  location.search = q.toString();
}

/* Hunting a draft id out of a URL is a miserable way to start a mock, so ask
   Sleeper what drafts this account has and offer them as buttons. */
el('bSync').onclick = async () => {
  setBanner('<b>Looking for your drafts…</b>', true);
  let drafts = [];
  if (D.myUserId) {
    try {
      drafts = (await api(`/user/${D.myUserId}/drafts/nfl/${D.season || new Date().getFullYear()}`)).data || [];
    } catch (e) { /* fall through to manual entry */ }
  }
  const rows = drafts.map(d => {
    const m = d.metadata || {}, s = d.settings || {};
    const label = `${m.name || 'Mock draft'} · ${s.teams || '?'}-team ${m.scoring_type || ''} · ${d.status}`;
    return `<button class="mini" data-draft="${esc(d.draft_id)}">${esc(label)}</button>`;
  }).join(' ');
  setBanner(
    (rows ? `<b>Your drafts</b> — ${rows}<br>` : '<b>No drafts came back for this account.</b> ')
    + '<button id="bManual" class="mini">enter a draft ID</button> '
    + '<button id="bDismiss" class="mini">cancel</button>', true);

  el('bManual').onclick = () => {
    const v = prompt('Sleeper draft ID, or paste the draft URL:', SYNC.draftId || '');
    if (v === null) return;
    goToDraft((v.match(/(\d{6,})/) || [])[1]);
  };
  el('bDismiss').onclick = () => { SYNC.sticky = false; setBanner(''); };
};

addEventListener('click', e => {
  const t = e.target.closest('[data-draft]');
  if (t) goToDraft(t.dataset.draft);
});


/* ===== ui.js ===== */
/* ui.js — render and events. Concatenated last; boots the app at the bottom. */

const TIER = pos => (pos === 'QB' ? 45 : pos === 'TE' ? 110 : 90);

function renderRecs() {
  const R = computeRecs();
  el('recs').innerHTML = R.map((r, i) => {
    const why = r.fills
      ? `fills your <b>${r.fills === 'K' ? 'kicker' : r.fills.replace('_', ' ').toLowerCase()}</b>`
      : '<span class="depth">bench depth</span>';
    const t = r.tier ? `<span class="tierchip">${r.pos} tier ${r.tier.tier}</span>` : '';
    const bz = r.buzz >= 25 ? `<span class="buzzchip">rising ${r.buzz}</span>` : '';
    const rk = isRookie(r.p) ? '<span class="rookiechip">rookie</span>' : '';
    const wait = !r.nxt ? `<b>nobody left at ${r.pos}</b> after this run`
      : r.tier && r.tier.survives === 0
        ? `<b class="warnTxt">tier ${r.tier.tier} is gone</b> before your next pick`
      : r.nxt.n === r.p.n ? 'should survive to your next pick — <b>no rush</b>'
      : `wait and you drop to <b>${esc(r.nxt.n)}</b> — <b>${r.urgency.toFixed(0)} spots</b>`;
    const val = r.bargain > 0 ? `<span class="edge-pos">${r.bargain.toFixed(0)} spots of value</span>`
      : `<span class="edge-neg">reaching ${(r.p.a - S.pick).toFixed(0)}</span>`;
    return `<div class="rec${i ? '' : ' top'}"><div class="rank">${i + 1}</div><div class="rec-main">
      <div class="rec-name"><span class="badge b-${r.p.p}">${r.p.p}</span>${esc(r.p.n)} ${t}${rk}${bz}</div>
      <div class="rec-why">${why} · ADP ${r.p.a.toFixed(0)} · ${val}</div>
      <div class="rec-why">${wait}</div></div>
      <button class="take mini" data-take="${esc(r.p.n)}">Draft</button></div>`;
  }).join('') || '<div class="rec"><div class="rec-main"><div class="rec-why">Board is empty.</div></div></div>';
}

function renderRunway(tgt) {
  const board = avail(), surv = survivors();
  el('scar').innerHTML = ['QB', 'RB', 'WR', 'TE'].map(pos => {
    const ts = tierState(pos, board, surv);
    if (!ts) return `<div class="scar"><div class="scar-hd"><span><span class="badge b-${pos}">${pos}</span> none left</span></div></div>`;
    const col = ts.survives === 0 ? 'var(--neg)' : ts.survives === 1 ? 'var(--hot)' : 'var(--pos)';
    const pct = Math.min(100, ts.survives / Math.max(1, ts.left) * 100);
    const who = ts.members.slice(0, 4).map(p => esc(p.n.split(' ').slice(-1)[0])).join(', ')
      + (ts.left > 4 ? ` +${ts.left - 4}` : '');
    const note = ts.survives === 0
      ? `<span class="warnTxt">All gone before pick ${tgt ?? '—'}.</span> Next is tier ${ts.tier + 1}.`
      : ts.survives === 1 ? `Only one reaches pick ${tgt ?? '—'}.`
      : `${ts.survives} of them reach pick ${tgt ?? '—'}.`;
    return `<div class="scar"><div class="scar-hd">
        <span><span class="badge b-${pos}">${pos}</span> <b>tier ${ts.tier}</b> · ${ts.left} left</span>
        <b style="color:${col}">${ts.survives} survive</b></div>
      <div class="meter"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="scar-note">${who}</div>
      <div class="scar-note">${note}</div></div>`;
  }).join('');
}

const line = p => `<span class="badge b-${p.p}">${p.p}</span><span>${esc(p.n)}</span>`
  + `<span class="spacer"></span><span class="mono" style="color:var(--faint);font-size:11px">${p.a.toFixed(0)}</span>`;

function renderRoster() {
  const { slots, bench } = fill(mine());
  el('roster').innerHTML = slots.map(s =>
    `<div class="slotrow"><span class="slotlab">${s.s}</span>${s.p ? line(s.p) : '<span class="empty">open</span>'}</div>`).join('');
  el('bench').innerHTML = bench.length
    ? bench.map(p => `<div class="slotrow">${line(p)}</div>`).join('')
    : `<div class="slotrow"><span class="empty">empty — ${D.bench} spots</span></div>`;
}

function renderBoard() {
  el('filters').innerHTML = ['ALL', 'QB', 'RB', 'WR', 'TE', 'PK', 'DEF'].map(x =>
    `<button class="mini${S.filter === x ? ' on' : ''}" data-f="${x}">${x}</button>`).join(' ')
    + ` <button class="mini${S.sort === 'fit' ? ' on' : ''}" data-sort="fit">need+value</button>`
    + `<button class="mini${S.sort === 'adp' ? ' on' : ''}" data-sort="adp">ADP</button>`;

  const q = el('q').value.trim().toLowerCase();
  const roster = mine(), left = myPicks().filter(x => x >= S.pick).length;
  const surv = S.sort === 'fit' ? survivors() : null;
  const rows = P.filter(p => {
    if (S.hide && S.drafted[p.n]) return false;
    if (S.filter !== 'ALL' && p.p !== S.filter) return false;
    if (q && !p.n.toLowerCase().includes(q) && !p.t.toLowerCase().includes(q)) return false;
    return true;
  });
  if (S.sort === 'fit') {
    rows.forEach(p => { p._fit = fitScore(p, roster, left, surv); });
    rows.sort((a, b) => b._fit - a._fit || a.a - b.a);
  } else {
    rows.sort((a, b) => a.a - b.a);
  }
  const top = rows.length ? Math.max(...rows.slice(0, 60).map(p => p._fit || 0)) : 1;

  /* How many of each position-tier are still undrafted. A tier number alone
     says nothing you can act on; "tier 2, 1 left" says take him now. Counted
     over the whole pool, not the filtered rows, so a search box or a position
     filter cannot make a tier look thinner than it is. */
  const tierLeft = new Map();
  for (const p of P) {
    if (S.drafted[p.n]) continue;
    const k = p.p + tierOf(p);
    tierLeft.set(k, (tierLeft.get(k) || 0) + 1);
  }

  el('tb').innerHTML = rows.slice(0, 300).map(p => {
    const st = S.drafted[p.n], e = S.pick - p.a;
    const t = tierOf(p), nLeft = tierLeft.get(p.p + t) || 0;
    // flag the last undrafted man in his tier: the cliff is right after him
    const last = !st && nLeft === 1;
    const fitPct = top > 0 ? Math.round(100 * (p._fit || 0) / top) : 0;
    const fitCell = S.sort === 'fit'
      ? `<td><span class="fitbar"><i style="width:${fitPct}%"></i></span></td>` : '<td></td>';
    return `<tr class="row ${st === 'me' ? 'mineRow' : ''} ${st ? 'gone' : ''} ${last ? 'tlast' : ''}" data-n="${esc(p.n)}">
      <td><span class="badge b-${p.p}">${p.p}</span>${esc(p.n)}${isRookie(p) ? '<span class="rookiechip">R</span>' : ''}</td>
      <td>${p.t}</td><td>${p.b ?? '—'}</td>
      <td title="${p.p} tier ${t}${st ? '' : ` — ${nLeft} still on the board`}"><span class="tno">${t}</span>${st ? '' : `<span class="tleft">· ${nLeft} left</span>`}</td>
      <td>${p.a.toFixed(1)}${p.est ? '~' : ''}</td>
      <td>${p.vor != null ? (p.vor >= 0 ? '+' : '') + p.vor.toFixed(0) + (p.vest ? '~' : '') : '—'}</td>
      <td class="${e >= 0 ? 'edge-pos' : 'edge-neg'}">${e >= 0 ? '+' : ''}${e.toFixed(0)}</td>
      ${fitCell}
      <td>${st ? (st === 'me' ? 'yours' : 'gone') : `<button class="mini" data-me="${esc(p.n)}">mine</button>`}</td></tr>`;
  }).join('');
}

/* Who picks before you do, and what they still need — the same signal the
   simulation uses, shown so you can sanity-check what it is telling you. */
function renderOpponents() {
  const card = el('oppCard');
  if (typeof liveRosters !== 'function' || !liveRosters()) { card.hidden = true; return; }
  card.hidden = false;

  const tgt = target();
  const nextFor = new Map();          // roster_id -> its next pick number
  for (const [n, rid] of SYNC.ownerOf) {
    if (n < S.pick || (SYNC.made && SYNC.made.has(n))) continue;
    if (!nextFor.has(rid) || n < nextFor.get(rid)) nextFor.set(rid, n);
  }

  const ids = [...new Set(SYNC.ownerOf.values())].filter(x => x != null);
  ids.sort((a, b) => (nextFor.get(a) ?? 1e9) - (nextFor.get(b) ?? 1e9));

  el('opps').innerHTML = ids.map(rid => {
    const roster = SYNC.rosters.get(rid) || [];
    const at = nextFor.get(rid);
    const soon = at != null && tgt != null && at < tgt;
    const isMe = rid === SYNC.myRosterId;
    const { slots } = fill(roster);
    const open = slots.filter(s => !s.p && !['K', 'DEF'].includes(s.s)).map(s => s.s);
    const counts = ['QB', 'RB', 'WR', 'TE'].map(p => {
      const n = roster.filter(x => x.p === p).length;
      return `<span class="cnt b-${p}${n ? '' : ' zero'}">${p} ${n}</span>`;
    }).join('');
    const name = SYNC.teamName.get(rid) || `Roster ${rid}`;
    return `<div class="opp${soon ? ' soon' : ''}${isMe ? ' me' : ''}">
      <div class="opp-hd"><span class="opp-name">${esc(isMe ? name + ' (you)' : name)}</span>
        <span class="opp-when">${at != null ? 'pick ' + at : 'done'}</span></div>
      <div class="opp-counts">${counts}</div>
      <div class="opp-need">${open.length ? 'needs <b>' + esc([...new Set(open)].join(', ')) + '</b>' : 'starters full'}</div>
    </div>`;
  }).join('');
}

/* Players the market is moving on right now, still on the board. Separate
   from the recommendations on purpose — this is a watchlist, not advice. */
function renderRising() {
  const rows = avail().map(p => ({ p, b: buzz(p) }))
    .filter(x => x.b >= 25)
    .sort((a, x) => x.b - a.b || a.p.a - x.p.a)
    .slice(0, 8);
  el('risingCard').hidden = rows.length === 0;
  el('rising').innerHTML = rows.map(({ p, b }) => {
    const why = [];
    if (p.vel > 0) why.push(`up ${p.vel.toFixed(0)} spots`);
    if (p.add) why.push(`${(p.add / 1000).toFixed(0)}k adds`);
    return `<div class="risebar" data-me="${esc(p.n)}" title="click to draft">
      <div class="rise-hd"><span><span class="badge b-${p.p}">${p.p}</span>${esc(p.n)}
        ${isRookie(p) ? '<span class="rookiechip">rookie</span>' : ''}</span>
        <b class="mono">${b}</b></div>
      <div class="meter"><i style="width:${b}%;background:var(--rise)"></i></div>
      <div class="scar-note">ADP ${p.a.toFixed(0)}${p.est ? '~' : ''} · ${why.join(' · ') || 'trending'}</div>
    </div>`;
  }).join('');
}

function render() {
  const n = nextPick(), tgt = target(), clock = onClock();
  el('sPick').textContent = S.pick;
  el('sNext').textContent = n ?? '—';
  el('sGap').textContent = clock ? 'now' : (n ? n - S.pick : '—');
  el('sLeft').textContent = myPicks().filter(x => x >= S.pick).length;
  el('bar').classList.toggle('clock', clock);
  el('clockMsg').textContent = clock ? "YOU'RE ON THE CLOCK" : '';
  el('bMock').classList.toggle('on', S.mock);
  el('bMock').textContent = S.mock ? 'Mock mode: ON' : 'Mock mode';
  el('bHide').classList.toggle('on', S.hide);

  renderRecs();
  renderRunway(tgt);
  renderRoster();
  renderBoard();
  renderRising();
  renderOpponents();
  if (typeof renderSync === 'function') renderSync();

  el('foot').innerHTML =
    'Click a row to mark a player gone. <kbd>Enter</kbd> in search marks the top hit gone; '
    + '<kbd>Shift</kbd>+<kbd>Enter</kbd> drafts him to you. '
    + `Values are ${esc(D.meta.src)}. State saves in this browser.`;
}

/* ---- events ---- */
addEventListener('click', e => {
  const t = e.target.closest('[data-take]') || e.target.closest('[data-me]');
  if (t) { mark(t.dataset.take || t.dataset.me, 'me'); e.stopPropagation(); return; }
  const f = e.target.closest('[data-f]');
  if (f) { S.filter = f.dataset.f; save(); render(); return; }
  const so = e.target.closest('[data-sort]');
  if (so) { S.sort = so.dataset.sort; save(); render(); return; }
  const r = e.target.closest('tr.row');
  if (r && !S.drafted[r.dataset.n]) mark(r.dataset.n, 'them');
});
el('q').addEventListener('input', render);
el('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = document.querySelector('#tb tr.row:not(.gone)');
  if (!first) return;
  mark(first.dataset.n, e.shiftKey ? 'me' : 'them');
  el('q').value = '';
  render();
});
el('bUndo').onclick = undo;
el('bHide').onclick = () => { S.hide = !S.hide; save(); render(); };
el('bMock').onclick = () => { S.mock = !S.mock; S.drafted = {}; S.hist = []; S.pick = 1; save(); render(); };
el('bReset').onclick = () => {
  if (confirm('Clear the whole board and start over?')) {
    S.drafted = {}; S.hist = []; S.pick = 1; save(); render();
  }
};
/* Modelled keepers, for use before the real ones are declared. Once a draft is
   synced the keepers arrive as picks and this button hides itself. */
el('bKeep').onclick = () => {
  (D.keepers || []).forEach(k => { if (byName.has(k.n) && !S.drafted[k.n]) S.drafted[k.n] = 'them'; });
  (D.mine || []).forEach(n => { if (byName.has(n)) S.drafted[n] = 'me'; });
  save(); render();
};

render();
if (typeof startSync === 'function') startSync();

</script>
